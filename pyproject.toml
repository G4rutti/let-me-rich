[project]
name = "trader"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "G4rutti", email = "davigarutti5@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "ccxt>=4.5.84",
    "fastmcp>=4.0.10",
    "httpx>=0.28.1",
    "metatrader5>=5.0.45 ; sys_platform == 'win32'",
    "python-dotenv>=1.2.3",
    "pyyaml>=6.0.3",
    "tzdata>=2026.4",
]

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
[tool.pytest.ini_options]
pythonpath = ["tests"]
