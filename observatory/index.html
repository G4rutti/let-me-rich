<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pregão 3D</title>
<style>
  :root {
    --bg: #05070d; --panel: rgba(10, 14, 24, .86); --line: rgba(120, 150, 200, .18);
    --text: #dfe7f5; --dim: #8a97ad; --gold: #f5c451; --luna: #a99bff; --sol: #ff7a45;
    --ok: #3ddc97; --bad: #ff4d5e; --ex: #4cc9f0;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); overflow: hidden;
    font: 13px/1.4 ui-sans-serif, system-ui, "Segoe UI", sans-serif; }
  #scene, #labels { position: fixed; inset: 0; }
  #labels { pointer-events: none; }
  .panel { position: fixed; background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
    backdrop-filter: blur(6px); }
  #top { top: 12px; left: 12px; padding: 10px 12px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap;
    max-width: calc(100vw - 24px - 360px); }
  #top h1 { font-size: 14px; margin: 0 6px 0 0; letter-spacing: .08em; text-transform: uppercase; color: var(--gold); }
  select, button { background: #111827; color: var(--text); border: 1px solid var(--line); border-radius: 6px;
    padding: 5px 8px; font: inherit; cursor: pointer; }
  button:hover, select:hover { border-color: #4b5d80; }
  button.on { background: #3b0d12; border-color: var(--bad); color: #ffd7db; }
  #live-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #555; margin-right: 5px; }
  button.on #live-dot { background: var(--bad); box-shadow: 0 0 8px var(--bad); animation: pulse 1s infinite; }
  @keyframes pulse { 50% { opacity: .35; } }
  #side { top: 12px; right: 12px; bottom: 12px; width: 340px; display: flex; flex-direction: column; }
  #side h2 { font-size: 11px; margin: 0; padding: 10px 12px 6px; color: var(--dim); text-transform: uppercase;
    letter-spacing: .1em; }
  #meta { padding: 0 12px 8px; color: var(--dim); font-size: 12px; border-bottom: 1px solid var(--line); }
  #log { flex: 1; overflow-y: auto; padding: 6px 8px 10px; }
  .ev { padding: 6px 8px; border-radius: 6px; margin-bottom: 4px; border-left: 3px solid transparent;
    background: rgba(255,255,255,.02); opacity: .45; transition: opacity .3s, background .3s; }
  .ev.done { opacity: .85; }
  .ev.now { opacity: 1; background: rgba(245,196,81,.08); border-left-color: var(--gold); }
  .ev b { font-weight: 600; }
  .ev .d { color: var(--dim); font-size: 12px; white-space: pre-wrap; word-break: break-word; max-height: 5.6em;
    overflow: hidden; }
  .ev.err b { color: var(--bad); }
  .tag { display: inline-block; font-size: 10px; padding: 1px 5px; border-radius: 4px; margin-right: 5px;
    text-transform: uppercase; letter-spacing: .05em; background: #1f2937; color: var(--dim); }
  .tag.luna { color: var(--luna); } .tag.sol { color: var(--sol); } .tag.ex { color: var(--ex); }
  .tag.risk { color: #c0c8d8; } .tag.arq { color: #d6b98c; } .tag.astra { color: var(--gold); }
  #summary { border-top: 1px solid var(--line); padding: 8px 12px 10px; max-height: 32%; overflow-y: auto;
    font-size: 12px; }
  #summary .act { margin: 3px 0; } #summary .act i { color: var(--dim); font-style: normal; }
  #bar { left: 12px; bottom: 12px; padding: 8px 12px; display: flex; gap: 18px; flex-wrap: wrap;
    max-width: calc(100vw - 24px - 360px); }
  #bar div span { color: var(--dim); margin-right: 6px; }
  #hint { position: fixed; left: 50%; bottom: 14px; transform: translateX(-50%); color: var(--dim); font-size: 11px;
    pointer-events: none; }

  /* rótulos e balões 3D */
  .name { padding: 2px 7px; border-radius: 4px; font-size: 11px; font-weight: 600; white-space: nowrap;
    background: rgba(5,7,13,.75); border: 1px solid var(--line); }
  .name small { display: block; font-weight: 400; color: var(--dim); font-size: 10px; }
  .sign { font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--dim); white-space: nowrap;
    background: rgba(5,7,13,.6); padding: 2px 8px; border-radius: 4px; }
  .bubble { max-width: 280px; padding: 7px 10px; border-radius: 10px; font-size: 12px; line-height: 1.35;
    background: rgba(250,250,255,.96); color: #10131a; box-shadow: 0 6px 24px rgba(0,0,0,.5); white-space: pre-wrap;
    word-break: break-word; opacity: 0; transform: translateY(6px); transition: opacity .25s, transform .25s; }
  .bubble.show { opacity: 1; transform: none; }
  .bubble.think { background: rgba(30,36,52,.95); color: #e6ecf8; font-style: italic; border: 1px dashed #4b5d80; }
  .bubble.bad { background: #ffe3e6; border: 2px solid var(--bad); }
  .bubble.good { background: #e2fbef; border: 2px solid var(--ok); }
  .bubble b { display: block; font-size: 10px; text-transform: uppercase; letter-spacing: .08em; opacity: .6; }

  @media (max-width: 800px) {
    #side { top: auto; height: 38%; left: 12px; width: auto; }
    #top, #bar { max-width: calc(100vw - 24px); }
    #bar { bottom: calc(38% + 20px); }
  }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",

</head>
<body>
<div id="scene"></div>
<div id="labels"></div>

<div id="top" class="panel">
  <h1>Pregão 3D</h1>
  <select id="cycles" title="ciclo"></select>
  <button id="play">⏸ pausar</button>
  <button id="restart">⟲ do início</button>
  <select id="speed" title="velocidade">
    <option value="0.5">0.5×</option><option value="1" selected>1×</option>
    <option value="2">2×</option><option value="4">4×</option>
  </select>
  <button id="live"><span id="live-dot"></span>ao vivo</button>
  <button id="follow">🎥 seguir operador</button>
</div>

<div id="side" class="panel">
  <h2>Ciclo</h2>
  <div id="meta">—</div>
  <div id="log"></div>
  <div id="summary"></div>
</div>

<div id="bar" class="panel">
  <div><span>regime</span><b id="s-regime">—</b></div>
  <div><span>banca</span><b id="s-equity">—</b></div>
  <div><span>posições</span><b id="s-pos">—</b></div>
  <div><span>tokens</span><b id="s-tokens">—</b></div>
</div>
<div id="hint">arraste para girar · scroll para zoom · botão direito para mover</div>

<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { CSS2DRenderer, CSS2DObject } from "three/addons/renderers/CSS2DRenderer.js";

const $ = (id) => document.getElementById(id);
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const tryJSON = (s) => { try { return JSON.parse(s); } catch { return null; } };

// ------------------------------------------------------------------ cena
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(1);   // GPU integrada: 1 já basta
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.35;
$("scene").appendChild(renderer.domElement);

const labels = new CSS2DRenderer();
labels.setSize(innerWidth, innerHeight);
$("labels").appendChild(labels.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x05070d);
scene.fog = new THREE.Fog(0x05070d, 38, 90);

const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.1, 300);
camera.position.set(2, 13, 17);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(2.2, 1, -4);
controls.enableDamping = true;
controls.maxPolarAngle = Math.PI * 0.47;
controls.minDistance = 6; controls.maxDistance = 45;

scene.add(new THREE.HemisphereLight(0xa9bcff, 0x3a2a18, 1.8));
scene.add(new THREE.AmbientLight(0x404a60, 0.8));
// luz de preenchimento quente vinda da frente (direcional: barata na GPU integrada)
const fill = new THREE.DirectionalLight(0xffe2b8, 1.1); fill.position.set(6, 14, 16); scene.add(fill);
const moon = new THREE.DirectionalLight(0xb8c8ff, 0.7);
moon.position.set(-10, 20, 12); moon.castShadow = true;
moon.shadow.mapSize.set(1024, 1024);
Object.assign(moon.shadow.camera, { left: -20, right: 20, top: 20, bottom: -20 });
scene.add(moon);

const mat = (color, o = {}) => new THREE.MeshStandardMaterial({ color, roughness: 0.6, metalness: 0.1, ...o });
function box(w, h, d, m, x, y, z, parent = scene) {
  const b = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), m);
  b.position.set(x, y, z); b.castShadow = b.receiveShadow = true; parent.add(b); return b;
}
function label(html, cls, x, y, z, parent = scene) {
  const el = document.createElement("div"); el.className = cls; el.innerHTML = html;
  const o = new CSS2DObject(el); o.position.set(x, y, z); parent.add(o); return o;
}

// piso em xadrez de mármore
{
  const c = document.createElement("canvas"); c.width = c.height = 512; const g = c.getContext("2d");
  for (let i = 0; i < 8; i++) for (let j = 0; j < 8; j++) {
    g.fillStyle = (i + j) % 2 ? "#3a3f4b" : "#4a505e"; g.fillRect(i * 64, j * 64, 64, 64);
  }
  const t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(5, 4);
  t.colorSpace = THREE.SRGBColorSpace;
  const floor = new THREE.Mesh(new THREE.PlaneGeometry(34, 28), mat(0xffffff, { map: t, roughness: 0.25, metalness: 0.3 }));
  floor.rotation.x = -Math.PI / 2; floor.position.z = -3; floor.receiveShadow = true; scene.add(floor);
}
// paredes: fundo com janelão, laterais
const wallM = mat(0x2a3040, { roughness: 0.9 });
box(34, 0.4, 0.4, wallM, 0, 0.2, -17);                    // rodapé do janelão
box(34, 1.2, 0.4, wallM, 0, 9.4, -17);                    // viga superior
for (let x = -16; x <= 16; x += 4) box(0.25, 9, 0.25, mat(0x2a3140, { metalness: 0.6 }), x, 4.5, -17); // montantes
const glass = new THREE.Mesh(new THREE.PlaneGeometry(34, 8.6),
  new THREE.MeshPhysicalMaterial({ color: 0x0b1a2e, transparent: true, opacity: 0.18, roughness: 0.05, metalness: 0.2 }));
glass.position.set(0, 4.6, -17); scene.add(glass);
box(0.4, 10, 28, wallM, -17, 5, -3); box(0.4, 10, 28, wallM, 17, 5, -3);

// skyline lá fora (Wall Street à noite)
function windowsTexture(seed) {
  const c = document.createElement("canvas"); c.width = 64; c.height = 128; const g = c.getContext("2d");
  g.fillStyle = "#070a12"; g.fillRect(0, 0, 64, 128);
  for (let y = 4; y < 128; y += 8) for (let x = 4; x < 64; x += 8) {
    const r = Math.sin(seed * 999 + x * 13.1 + y * 7.7) * 0.5 + 0.5;
    if (r > 0.55) { g.fillStyle = r > 0.9 ? "#ffe9b0" : "#f3c46a"; g.globalAlpha = 0.35 + r * 0.6; g.fillRect(x, y, 4, 4); }
  }
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.magFilter = THREE.NearestFilter; return t;
}
for (let i = 0; i < 46; i++) {
  const w = 3 + Math.random() * 5, h = 8 + Math.random() * 38, d = 3 + Math.random() * 5;
  const x = -60 + i * 2.7 + Math.random() * 2, z = -26 - Math.random() * 38;
  const t = windowsTexture(i); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(Math.ceil(w / 3), Math.ceil(h / 6));
  const b = new THREE.Mesh(new THREE.BoxGeometry(w, h, d),
    new THREE.MeshStandardMaterial({ color: 0x0a0e18, emissive: 0xffffff, emissiveMap: t, emissiveIntensity: 0.9 }));
  b.position.set(x, h / 2 - 2, z); scene.add(b);
}

// ------------------------------------------------------------------ telas (canvas → textura)
function screenTex(w, h) {
  const c = document.createElement("canvas"); c.width = w; c.height = h;
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace;
  return { c, g: c.getContext("2d"), t };
}
function monitor(parent, x, y, z, ry, w = 0.9, h = 0.55, color = 0x4cc9f0) {
  const s = screenTex(256, 160);
  const frame = box(w + 0.06, h + 0.06, 0.05, mat(0x0b0d12, { metalness: 0.5 }), x, y, z, parent);
  frame.rotation.y = ry;
  const scr = new THREE.Mesh(new THREE.PlaneGeometry(w, h),
    new THREE.MeshBasicMaterial({ map: s.t, toneMapped: false }));
  scr.position.set(0, 0, 0.03); frame.add(scr);
  s.color = "#" + new THREE.Color(color).getHexString();
  return s;
}
function drawChart(s, t, hot) {
  const { g, c } = s;
  g.fillStyle = "#060910"; g.fillRect(0, 0, c.width, c.height);
  g.strokeStyle = "rgba(120,150,200,.12)";
  for (let y = 20; y < c.height; y += 28) { g.beginPath(); g.moveTo(0, y); g.lineTo(c.width, y); g.stroke(); }
  let p = 80;
  for (let i = 0; i < 26; i++) {
    const n = Math.sin(i * 0.7 + t * (hot ? 2.2 : 0.6) + s.seed) * 14 + Math.sin(i * 2.3 + s.seed * 3) * 8;
    const o = p, cl = 80 + n - i * 0.4 * s.trend; p = cl;
    const hi = Math.min(o, cl) - 6 - Math.abs(n) * 0.2, lo = Math.max(o, cl) + 6;
    g.strokeStyle = g.fillStyle = cl < o ? "#3ddc97" : "#ff4d5e";
    const x = 10 + i * 9.2;
    g.beginPath(); g.moveTo(x + 3, hi); g.lineTo(x + 3, lo); g.stroke();
    g.fillRect(x, Math.min(o, cl), 6, Math.max(2, Math.abs(cl - o)));
  }
  g.fillStyle = hot ? s.color : "rgba(200,210,230,.5)"; g.font = "bold 13px monospace";
  g.fillText(s.title || "", 8, 16);
  s.t.needsUpdate = true;
}

// ------------------------------------------------------------------ mobília e estações
const STATIONS = {};
function desk(x, z, ry, accent, nMon = 3, withLamp = true) {
  const grp = new THREE.Group(); grp.position.set(x, 0, z); grp.rotation.y = ry; scene.add(grp);
  box(2.6, 0.08, 1.1, mat(0x3a2a1c, { roughness: 0.4 }), 0, 0.78, 0, grp);
  box(0.08, 0.76, 1.0, mat(0x222733), -1.22, 0.38, 0, grp); box(0.08, 0.76, 1.0, mat(0x222733), 1.22, 0.38, 0, grp);
  const mons = [];
  for (let i = 0; i < nMon; i++) {
    const off = (i - (nMon - 1) / 2) * 0.85;
    const s = monitor(grp, off, 1.25, -0.35, -off * 0.25, 0.8, 0.5, accent);
    s.seed = Math.random() * 10; s.trend = Math.random() - 0.3; mons.push(s);
  }
  const lamp = withLamp ? new THREE.PointLight(accent, 0.0, 6, 1.6) : { intensity: 0 };
  if (withLamp) { lamp.position.set(0, 1.8, 0.3); grp.add(lamp); }
  return { grp, mons, lamp };
}

// operador (centro)
const dAstra = desk(0, 0, Math.PI, 0xf5c451, 3);            // monitores virados para trás; ele fica em z=-1.2
// leitor de gráficos (esquerda) e advogado do diabo (direita)
const dLuna = desk(-7, -2, Math.PI, 0xa99bff, 4);
const dSol = desk(7, -2, Math.PI, 0xff7a45, 2);
// mesas de figurantes para dar vida
const extras = [desk(-8, 6, 0, 0x4cc9f0, 2, false), desk(-3, 7, 0, 0x4cc9f0, 3, false), desk(3, 7, 0, 0x4cc9f0, 3, false), desk(8, 6, 0, 0x4cc9f0, 2, false)];
extras.forEach((d) => d.mons.forEach((m) => (m.title = ["BTC", "ETH", "SOL", "BNB", "XRP", "DOGE"][Math.floor(Math.random() * 6)])));
dLuna.mons.forEach((m, i) => (m.title = ["1h", "4h", "1h", "4h"][i]));
dSol.mons.forEach((m, i) => (m.title = ["RISCO", "CONTRA"][i]));
dAstra.mons.forEach((m, i) => (m.title = ["CARTEIRA", "SCAN", "ORDENS"][i]));

// painel da exchange (parede de fundo, antes do janelão)
const exScreen = screenTex(1600, 560);
const exWall = new THREE.Group(); exWall.position.set(0, 0, -13.5); scene.add(exWall);
box(12.4, 4.6, 0.3, mat(0x0b0d12, { metalness: 0.6 }), 0, 4.2, 0, exWall);
const exMesh = new THREE.Mesh(new THREE.PlaneGeometry(12, 4.2),
  new THREE.MeshBasicMaterial({ map: exScreen.t, toneMapped: false }));
exMesh.position.set(0, 4.2, 0.17); exWall.add(exMesh);
box(0.3, 2, 0.3, mat(0x2a3140, { metalness: 0.7 }), -4, 1, 0, exWall); box(0.3, 2, 0.3, mat(0x2a3140, { metalness: 0.7 }), 4, 1, 0, exWall);
box(3.2, 1.05, 0.9, mat(0x1c2230, { metalness: 0.4 }), 0, 0.52, 1.3, exWall);   // balcão
const exLight = new THREE.PointLight(0x4cc9f0, 1.2, 14, 1.5); exLight.position.set(0, 4, -11.5); scene.add(exLight);

// cofre do risk manager (fundo esquerda)
const vault = new THREE.Group(); vault.position.set(-11, 0, -9.5); vault.rotation.y = Math.PI / 5; scene.add(vault);
box(2.6, 3.2, 1.6, mat(0x5b6474, { metalness: 0.85, roughness: 0.35 }), 0, 1.6, 0, vault);
const wheel = new THREE.Mesh(new THREE.TorusGeometry(0.5, 0.07, 12, 32), mat(0xd8dde8, { metalness: 1, roughness: 0.2 }));
wheel.position.set(0, 1.7, 0.83); vault.add(wheel);
for (let i = 0; i < 3; i++) { const s = box(0.06, 0.9, 0.06, mat(0xd8dde8, { metalness: 1 }), 0, 0, 0, wheel); s.rotation.z = (i * Math.PI) / 3; }
const vaultLight = new THREE.PointLight(0xc0c8d8, 0.2, 6); vaultLight.position.set(-10, 3, -8); scene.add(vaultLight);

// arquivo/diário (fundo direita)
const arq = new THREE.Group(); arq.position.set(11, 0, -9.5); arq.rotation.y = -Math.PI / 5; scene.add(arq);
box(3.2, 3.4, 0.7, mat(0x3a2a1c), 0, 1.7, 0, arq);
const bookColors = [0x8c2f39, 0x2f5d8c, 0xd6b98c, 0x3d6b4f, 0x6b4f8c, 0xb5651d];
for (let r = 0; r < 4; r++) {
  box(3.0, 0.05, 0.6, mat(0x2a1d12), 0, 0.35 + r * 0.8, 0.08, arq);
  for (let i = 0; i < 14; i++) box(0.16, 0.5 + Math.random() * 0.15, 0.45, mat(bookColors[(i + r) % 6]), -1.35 + i * 0.2, 0.62 + r * 0.8, 0.1, arq);
}
const arqLight = new THREE.PointLight(0xd6b98c, 0.2, 6); arqLight.position.set(10, 3, -8); scene.add(arqLight);

label("Exchange · Binance", "sign", 0, 7.0, -13.3);
label("Risk manager · código", "sign", -11, 3.9, -9.5);
label("Arquivo · diário", "sign", 11, 3.9, -9.5);

// onde o operador para em cada estação
STATIONS.desk = new THREE.Vector3(0, 0, -1.25);
STATIONS.luna = new THREE.Vector3(-5.6, 0, -0.6);
STATIONS.sol = new THREE.Vector3(5.6, 0, -0.6);
STATIONS.ex = new THREE.Vector3(0, 0, -10.6);
STATIONS.risk = new THREE.Vector3(-9.2, 0, -7.4);
STATIONS.arq = new THREE.Vector3(9.2, 0, -7.4);
const STATION_OF = {
  preflight: "risk", get_safety_status: "risk",
  sync_positions: "ex", get_portfolio: "ex", get_regime: "ex", scan_market: "ex", get_candles: "ex",
  move_stop: "ex", take_partial: "ex", close_position: "ex",
  read_charts: "luna", place_entry: "sol",
  get_pending_postmortems: "arq", get_setup_stats: "arq", get_recent_journal: "arq", write_journal: "arq",
  write_proposal: "arq",
};
const TAG = { risk: "risk", ex: "ex", luna: "luna", sol: "sol", arq: "arq", desk: "astra" };
const TAGNAME = { risk: "risco", ex: "exchange", luna: "luna", sol: "sol", arq: "arquivo", desk: "astra" };

// ------------------------------------------------------------------ pessoas
function person(suit, accent, skin = 0xe0b089) {
  const g = new THREE.Group();
  const legs = box(0.42, 0.8, 0.26, mat(0x14161c), 0, 0.4, 0, g);
  const body = new THREE.Mesh(new THREE.CapsuleGeometry(0.3, 0.55, 6, 12), mat(suit, { roughness: 0.5 }));
  body.position.y = 1.2; body.castShadow = true; g.add(body);
  box(0.1, 0.42, 0.04, mat(accent, { emissive: accent, emissiveIntensity: 0.4 }), 0, 1.25, 0.29, g);   // gravata
  const head = new THREE.Mesh(new THREE.SphereGeometry(0.24, 20, 16), mat(skin, { roughness: 0.7 }));
  head.position.y = 1.86; head.castShadow = true; g.add(head);
  const hair = new THREE.Mesh(new THREE.SphereGeometry(0.25, 20, 12, 0, Math.PI * 2, 0, Math.PI / 2.2), mat(0x1a1410));
  hair.position.y = 1.9; g.add(hair);
  g.userData = { legs, body, head };
  scene.add(g); return g;
}
function nameTag(p, name, role, model, color) {
  const o = label(`<span style="color:${color}">${name}</span><small>${role}${model ? " · " + model : ""}</small>`,
    "name", 0, 2.45, 0, p);
  return o;
}
function bubbleFor(p, y = 3.05) {
  const el = document.createElement("div"); el.className = "bubble";
  const o = new CSS2DObject(el); o.position.set(0, y, 0); p.add(o);
  return { el, timer: 0 };
}

const astra = person(0x1f2a44, 0xf5c451); astra.position.copy(STATIONS.desk);
const luna = person(0x2b2240, 0xa99bff, 0xf1c9a5); luna.position.set(-7, 0, -3.1);
const sol = person(0x3a1c14, 0xff7a45, 0xc68a5e); sol.position.set(7, 0, -3.1);
luna.rotation.y = sol.rotation.y = 0;
const tags = {
  astra: nameTag(astra, "ASTRA", "operador", "", "var(--gold)"),
  luna: nameTag(luna, "LUNA", "leitor de gráficos", "", "var(--luna)"),
  sol: nameTag(sol, "SOL", "advogado do diabo", "", "var(--sol)"),
};
const bub = { astra: bubbleFor(astra), luna: bubbleFor(luna), sol: bubbleFor(sol) };
// figurantes sentados nas mesas de trás
extras.forEach((d, i) => {
  const f = person([0x2d3342, 0x3a3f4f, 0x252a36, 0x32394a][i], 0x4cc9f0, [0xe0b089, 0xc68a5e, 0xf1c9a5, 0x8d5a3b][i]);
  f.position.set(d.grp.position.x, 0, d.grp.position.z + 0.9); f.rotation.y = Math.PI; f.userData.extra = true;
});

function say(who, html, kind = "", ms = 3200) {
  const b = bub[who]; clearTimeout(b.timer);
  b.el.className = "bubble " + kind; b.el.innerHTML = html;
  requestAnimationFrame(() => b.el.classList.add("show"));
  if (ms) b.timer = setTimeout(() => b.el.classList.remove("show"), ms / speed());
}

// ------------------------------------------------------------------ efeitos
const flashes = [];
function flash(pos, color) {
  const l = new THREE.PointLight(color, 6, 10, 1.5); l.position.copy(pos).add(new THREE.Vector3(0, 2.5, 0));
  scene.add(l); flashes.push({ l, t: 0 });
  const ring = new THREE.Mesh(new THREE.RingGeometry(0.2, 0.35, 40),
    new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 0.9, side: THREE.DoubleSide }));
  ring.rotation.x = -Math.PI / 2; ring.position.copy(pos).setY(0.03); scene.add(ring); flashes.push({ ring, t: 0 });
}
const packets = [];
function packet(from, to, color) {   // "papel" voando entre estações
  const m = new THREE.Mesh(new THREE.BoxGeometry(0.28, 0.02, 0.36),
    new THREE.MeshStandardMaterial({ color: 0xffffff, emissive: color, emissiveIntensity: 1.2 }));
  scene.add(m); packets.push({ m, from: from.clone().setY(1.6), to: to.clone().setY(1.6), t: 0 });
}
const working = { luna: 0, sol: 0, ex: 0, risk: 0, arq: 0 };

// ------------------------------------------------------------------ painel da exchange
const state = { regime: "—", equity: null, free: null, positions: [], candidates: [], last: "aguardando ciclo…",
  status: "", tokens: null };
function drawExchange(now) {
  const { g, c } = exScreen;
  g.fillStyle = "#03060c"; g.fillRect(0, 0, c.width, c.height);
  g.fillStyle = "#4cc9f0"; g.font = "bold 44px monospace"; g.fillText("PREGÃO · SPOT USDT", 40, 70);
  g.fillStyle = "#8a97ad"; g.font = "28px monospace";
  g.fillText(new Date(now).toLocaleTimeString("pt-BR"), c.width - 200, 70);
  const reg = state.regime, rc = reg === "BULL" ? "#3ddc97" : reg === "BEAR" ? "#ff4d5e" : "#f5c451";
  g.font = "bold 40px monospace"; g.fillStyle = rc; g.fillText("REGIME " + reg, 40, 140);
  g.fillStyle = "#dfe7f5";
  g.fillText("BANCA " + (state.equity != null ? "US$ " + state.equity.toFixed(2) : "—"), 560, 140);
  g.fillText("LIVRE " + (state.free != null ? state.free.toFixed(2) + " USDT" : "—"), 1080, 140);
  g.font = "30px monospace"; let y = 210;
  g.fillStyle = "#8a97ad"; g.fillText("POSIÇÕES", 40, y); y += 44;
  if (!state.positions.length) { g.fillStyle = "#5b6474"; g.fillText("nenhuma", 40, y); y += 44; }
  for (const p of state.positions.slice(0, 4)) {
    const r = p.r_now ?? 0; g.fillStyle = r >= 0 ? "#3ddc97" : "#ff4d5e";
    g.fillText(`${p.symbol.padEnd(11)} ${String(p.r_now ?? "?").padStart(6)}R  stop ${p.stop}  alvo ${p.target}`, 40, y); y += 42;
  }
  g.fillStyle = "#8a97ad"; g.fillText("CANDIDATOS DO SCAN", 900, 210);
  state.candidates.slice(0, 6).forEach((cd, i) => {
    g.fillStyle = "#dfe7f5"; g.fillText(`${(cd.symbol || "").padEnd(12)} ${cd.score ?? ""}`, 900, 254 + i * 42);
  });
  // letreiro rolando
  g.fillStyle = "#0b1a2e"; g.fillRect(0, c.height - 70, c.width, 70);
  g.fillStyle = "#f5c451"; g.font = "bold 32px monospace";
  const txt = ("   ▸ " + state.last + "   ").repeat(3); const w = g.measureText(txt).width / 3;
  g.fillText(txt, -((now / 8) % w), c.height - 24);
  exScreen.t.needsUpdate = true;
}
function absorb(tool, text) {   // atualiza painel/barra a partir dos resultados das tools
  const j = tryJSON(text); if (!j) return;
  if (tool === "get_regime" && j.regime) state.regime = j.regime;
  if (tool === "get_portfolio") { state.equity = j.equity_usd; state.free = j.free_usdt; state.positions = j.positions || []; }
  if (tool === "scan_market" && j.candidates) state.candidates = j.candidates;
  if (tool === "preflight" && j.status) state.status = j.status;
  renderBar();
}
function renderBar() {
  $("s-regime").textContent = state.regime;
  $("s-equity").textContent = state.equity != null ? "US$ " + state.equity.toFixed(2) : "—";
  $("s-pos").textContent = state.positions.map((p) => `${p.symbol} ${p.r_now ?? "?"}R`).join(" · ") || "nenhuma";
  $("s-tokens").textContent = state.tokens ? `${Math.round(state.tokens.input_tokens / 1000)}k in · ${state.tokens.output_tokens} out` : "—";
}

// ------------------------------------------------------------------ movimento do operador
let walkTarget = null, walkResolve = null;
function walkTo(key) {
  const to = STATIONS[key];
  if (astra.position.distanceTo(to) < 0.05) return Promise.resolve();
  walkTarget = to.clone();
  return new Promise((r) => (walkResolve = r));
}
function faceTowards(obj, target) {
  const d = target.clone().sub(obj.position); obj.rotation.y = Math.atan2(d.x, d.z);
}
const FACE = { desk: new THREE.Vector3(0, 0, 0), luna: new THREE.Vector3(-7, 0, -3), sol: new THREE.Vector3(7, 0, -3),
  ex: new THREE.Vector3(0, 0, -14), risk: new THREE.Vector3(-11, 0, -9.5), arq: new THREE.Vector3(11, 0, -9.5) };
let atStation = "desk";

// ------------------------------------------------------------------ linha do tempo
let meta = {}, current = null, events = [], idx = 0, paused = false, live = false, follow = false, epoch = 0;
const speed = () => Number($("speed").value);

function toolSummary(tool, text) {
  const j = tryJSON(text);
  if (!j) return text.slice(0, 220);
  switch (tool) {
    case "preflight": return `status ${j.status} · modo ${j.mode}` + (j.problems?.length ? `\n${j.problems.join("; ")}` : "");
    case "sync_positions": return `${(j.events || []).length} evento(s) de sync`;
    case "get_regime": return `regime ${j.regime} · BTC 4h ${j.btc_trend_4h} · 1h ${j.btc_trend_1h}`;
    case "get_portfolio": return `banca US$ ${j.equity_usd} · livre ${j.free_usdt}\n` +
      (j.positions || []).map((p) => `${p.symbol} ${p.r_now ?? "?"}R`).join(", ");
    case "get_safety_status": return `trades hoje ${j.trades_today}/${j.max_trades_per_day} · perda restante US$ ${j.daily_loss_left_usd}`;
    case "scan_market": return `${(j.candidates || []).length} candidato(s): ` + (j.candidates || []).slice(0, 5).map((c) => c.symbol).join(", ");
    case "read_charts": return (j.pairs || []).map((p) => `${p.symbol}: 4h ${p.trend_4h}, 1h ${p.trend_1h}, ${p.pattern}\n  sup ${p.support} · res ${p.resistance} · inval ${p.invalidation}`).join("\n");
    case "get_setup_stats": return "estatísticas por setup consultadas";
    case "get_recent_journal": return `${(j.entries || []).length} registro(s) do diário`;
    case "get_pending_postmortems": return `${(j.trades || []).length} post-mortem(s) pendente(s)`;
    case "write_journal": return `diário #${j.journal_id}`;
    case "place_entry": return `ORDEM ${j.status ?? ""} · trade ${j.trade_id ?? ""}` + (j.bear_review ? `\nsol: força ${j.bear_review.strength} (${j.bear_review.verdict})` : "");
    default: return text.slice(0, 220);
  }
}
function argsText(tool, a) {
  if (tool === "write_journal") return `${a.kind}${a.symbol ? " " + a.symbol : ""}${a.thesis ? ": " + a.thesis : a.lesson ? ": " + a.lesson : ""}`;
  if (tool === "place_entry") return `${a.symbol} ${a.setup}\nstop ${a.stop_price} · alvo ${a.target_price}\n${a.reason ?? ""}`;
  if (tool === "read_charts") return (a.symbols || []).join(", ");
  if (tool === "move_stop") return `${a.symbol} → ${a.new_stop}`;
  if (tool === "close_position" || tool === "take_partial") return `${a.symbol} ${a.fraction ?? ""} ${a.reason ?? ""}`;
  const s = Object.entries(a || {}).map(([k, v]) => `${k}=${v}`).join(" "); return s;
}

function logEvent(ev, i) {
  const st = ev.kind === "tool" ? STATION_OF[ev.tool] || "ex" : "desk";
  const div = document.createElement("div"); div.className = "ev"; div.id = "ev" + i;
  if (ev.kind === "tool") {
    const bad = ev.error || /RECUSADO|EXCHANGE/.test(ev.result || "");
    if (bad) div.classList.add("err");
    div.innerHTML = `<span class="tag ${TAG[st]}">${TAGNAME[st]}</span><b>${esc(ev.tool)}</b>` +
      `<div class="d">${esc(ev.phase === "start" ? argsText(ev.tool, ev.args) : ev.error || toolSummary(ev.tool, ev.result || ""))}</div>`;
  } else if (ev.kind === "message") {
    const j = tryJSON(ev.text);
    div.innerHTML = `<span class="tag astra">astra</span><b>${j ? "resposta final" : "pensa"}</b><div class="d">${esc(j ? j.summary : ev.text)}</div>`;
  } else if (ev.kind === "usage") {
    div.innerHTML = `<span class="tag">fim</span><b>tokens</b><div class="d">${ev.usage.input_tokens} in (${ev.usage.cached_input_tokens ?? 0} cache) · ${ev.usage.output_tokens} out</div>`;
  } else {
    div.classList.add("err"); div.innerHTML = `<span class="tag">erro</span><b>codex</b><div class="d">${esc(ev.text)}</div>`;
  }
  $("log").appendChild(div);
}
function markNow(i) {
  document.querySelectorAll(".ev.now").forEach((e) => { e.classList.remove("now"); e.classList.add("done"); });
  const e = $("ev" + i); if (e) { e.classList.add("now"); e.scrollIntoView({ block: "nearest", behavior: "smooth" }); }
}

async function handle(ev, i, my) {
  markNow(i);
  const w = (ms) => sleep(ms / speed());
  if (ev.kind === "message") {
    const j = tryJSON(ev.text);
    if (j) { await walkTo("desk"); atStation = "desk"; say("astra", `<b>fim do ciclo</b>${esc(j.summary)}`, "", 6000); renderSummary(j); }
    else say("astra", esc(ev.text.slice(0, 260)), "think", 3600);
    return w(1600);
  }
  if (ev.kind === "usage") { state.tokens = ev.usage; renderBar(); return w(300); }
  if (ev.kind === "error") { say("astra", `<b>erro</b>${esc(ev.text.slice(0, 200))}`, "bad", 5000); return w(1800); }

  const st = STATION_OF[ev.tool] || "ex";
  if (ev.phase === "start") {
    await walkTo(st); if (my !== epoch) return; atStation = st;
    working[st] = 1; state.last = `${ev.tool} ${argsText(ev.tool, ev.args).split("\n")[0]}`;
    say("astra", `<b>${esc(ev.tool)}</b>${esc(argsText(ev.tool, ev.args).slice(0, 220))}`, "", 2600);
    if (st === "luna") { say("luna", "<b>lendo velas 1h/4h…</b>", "think", 0); packet(STATIONS.luna, new THREE.Vector3(0, 0, -13), 0x4cc9f0); }
    if (st === "sol") say("sol", "<b>procurando motivo para NÃO entrar…</b>", "think", 0);
    return w(900);
  }
  // fim da chamada
  if (atStation !== st) { await walkTo(st); atStation = st; }
  working[st] = 0;
  const text = ev.result || "", err = ev.error || (/^(RECUSADO|EXCHANGE|INVALIDO)/.test(text) ? text : null);
  absorb(ev.tool, text);
  if (ev.tool === "read_charts") {
    packet(new THREE.Vector3(-7, 0, -3), STATIONS.luna, 0xa99bff);
    say("luna", err ? `<b>falhou</b>${esc(err)}` : esc(toolSummary(ev.tool, text)), err ? "bad" : "", 5200);
    return w(3000);
  }
  if (ev.tool === "place_entry") {
    if (err && /BEAR_VETO/.test(err)) {
      say("sol", `<b>VETO</b>${esc(err.replace(/^RECUSADO BEAR_VETO:\s*/, ""))}`, "bad", 6500);
      flash(STATIONS.sol, 0xff4d5e); state.last = "SOL VETOU A ENTRADA"; return w(3500);
    }
    if (err) { say("astra", `<b>recusado</b>${esc(err)}`, "bad", 5000); flash(STATIONS.sol, 0xff4d5e); return w(3000); }
    const j = tryJSON(text) || {};
    say("sol", `<b>sem veto</b>força ${j.bear_review?.strength ?? "?"}`, "good", 3000);
    await w(1200); await walkTo("ex"); atStation = "ex";
    flash(STATIONS.ex, 0x3ddc97); packet(STATIONS.ex, new THREE.Vector3(0, 0, -13), 0x3ddc97);
    say("astra", `<b>ordem enviada</b>${esc(toolSummary(ev.tool, text))}`, "good", 5000);
    state.last = `COMPRA ${ev.args.symbol}`; return w(3000);
  }
  if (err) { say("astra", `<b>${esc(ev.tool)}</b>${esc(err)}`, "bad", 4200); flash(STATIONS[st], 0xff4d5e); return w(2200); }
  if (["move_stop", "take_partial", "close_position"].includes(ev.tool)) flash(STATIONS.ex, 0xf5c451);
  if (ev.tool === "preflight") wheelSpin = 1;
  say("astra", `<b>${esc(ev.tool)}</b>${esc(toolSummary(ev.tool, text))}`, "", 3000);
  return w(1300);
}

function renderSummary(j) {
  const acts = (j.actions || []).map((a) =>
    `<div class="act"><span class="tag ${a.type === "entry" ? "ex" : a.type === "skip" ? "" : "astra"}">${esc(a.type)}</span>` +
    `<b>${esc(a.symbol)}</b> <i>${esc(a.detail)}</i></div>`).join("");
  $("summary").innerHTML = `<b>preflight ${esc(j.preflight_status)} · regime ${esc(j.regime)}</b>${acts}`;
}

async function runner() {
  for (;;) {
    const my = epoch;
    if (paused || idx >= events.length) { await sleep(200); continue; }
    const i = idx++;
    await handle(events[i], i, my);
  }
}

function reset() {
  epoch++; idx = 0; events = []; $("log").innerHTML = ""; $("summary").innerHTML = "";
  Object.keys(working).forEach((k) => (working[k] = 0));
  Object.values(bub).forEach((b) => b.el.classList.remove("show"));
  astra.position.copy(STATIONS.desk); walkTarget = null; if (walkResolve) walkResolve(); atStation = "desk";
  Object.assign(state, { regime: "—", equity: null, free: null, positions: [], candidates: [], last: "…", tokens: null });
  renderBar();
}
function pushEvents(list) {
  for (let i = events.length; i < list.length; i++) { events.push(list[i]); logEvent(list[i], i); }
}
async function load(id) {
  const c = await (await fetch("/api/cycle/" + id)).json();
  reset(); current = c;
  $("meta").innerHTML = `${esc(c.id)} · <b>${esc(c.status)}</b><br>${esc((c.started_at || "").replace("T", " ").slice(0, 19))}` +
    (c.running ? " · <b style='color:var(--bad)'>rodando agora</b>" : "");
  pushEvents(c.events);
  if (!c.events.length && c.summary) renderSummary(c.summary);
}
async function refreshList(select) {
  const list = await (await fetch("/api/cycles")).json();
  const sel = $("cycles"), keep = sel.value;
  sel.innerHTML = list.map((c) => `<option value="${c.id}">${c.id.replace("cycle-", "")} · ${c.status}</option>`).join("");
  sel.value = select || keep || (list[0] && list[0].id);
  return list;
}
async function livePoll() {
  if (!live) return;
  try {
    const list = await refreshList();
    const newest = list[0];
    if (newest && (!current || newest.id !== current.id)) { await refreshList(newest.id); await load(newest.id); }
    else if (current && (current.running || current.status === "?")) {
      const c = await (await fetch("/api/cycle/" + current.id)).json();
      current.running = c.running; current.status = c.status; pushEvents(c.events);
    }
  } catch (e) { console.warn(e); }
  setTimeout(livePoll, 2000);
}

// ------------------------------------------------------------------ controles
$("cycles").onchange = (e) => load(e.target.value);
$("play").onclick = () => { paused = !paused; $("play").textContent = paused ? "▶ continuar" : "⏸ pausar"; };
$("restart").onclick = () => current && load(current.id);
$("live").onclick = () => { live = !live; $("live").classList.toggle("on", live); if (live) livePoll(); };
$("follow").onclick = () => { follow = !follow; $("follow").classList.toggle("on", follow); };

// ------------------------------------------------------------------ loop de render
let wheelSpin = 0, lastScreens = -1, lastExtras = -9, lastEx = -1;
const clock = new THREE.Clock();
function tick() {
  const dt = Math.min(clock.getDelta(), 0.05), t = clock.elapsedTime, sp = speed();
  // caminhada
  if (walkTarget) {
    const d = walkTarget.clone().sub(astra.position); d.y = 0;
    const dist = d.length(), step = 4.2 * sp * dt;
    if (dist <= step) {
      astra.position.copy(walkTarget); walkTarget = null; faceTowards(astra, FACE[atStation === "desk" ? "desk" : atStation]);
      const r = walkResolve; walkResolve = null; r && r();
    } else {
      astra.position.add(d.normalize().multiplyScalar(step)); astra.rotation.y = Math.atan2(d.x, d.z);
      astra.userData.body.position.y = 1.2 + Math.abs(Math.sin(t * 12 * sp)) * 0.06;
      astra.userData.legs.scale.y = 1 - Math.abs(Math.sin(t * 12 * sp)) * 0.08;
    }
  } else {
    astra.userData.body.position.y = 1.2 + Math.sin(t * 2) * 0.01;
    faceTowards(astra, FACE[atStation] || FACE.desk);
  }
  // quem está trabalhando balança e acende a mesa
  for (const [k, p, d] of [["luna", luna, dLuna], ["sol", sol, dSol]]) {
    const on = working[k];
    p.userData.head.position.y = 1.86 + (on ? Math.sin(t * 9) * 0.03 : 0);
    p.userData.head.rotation.y = on ? Math.sin(t * 3) * 0.5 : Math.sin(t * 0.5) * 0.15;
    d.lamp.intensity += ((on ? 3.2 : 0.25) - d.lamp.intensity) * 0.1;
  }
  dAstra.lamp.intensity += ((atStation === "desk" ? 1.5 : 0.3) - dAstra.lamp.intensity) * 0.1;
  exLight.intensity = 1.2 + (working.ex ? Math.sin(t * 10) * 0.8 + 1 : 0);
  vaultLight.intensity += ((working.risk ? 3 : 0.3) - vaultLight.intensity) * 0.1;
  arqLight.intensity += ((working.arq ? 3 : 0.3) - arqLight.intensity) * 0.1;
  if (wheelSpin > 0) { wheel.rotation.z += dt * 6 * sp; wheelSpin -= dt * sp * 0.8; }
  // telas
  // telas: redesenhar canvas custa upload de textura; ~4 Hz é o bastante
  if (t - lastScreens > 0.25) {
    lastScreens = t;
    dLuna.mons.forEach((m) => drawChart(m, t, working.luna));
    dSol.mons.forEach((m) => drawChart(m, t, working.sol));
    dAstra.mons.forEach((m) => drawChart(m, t, atStation === "desk"));
    if (t - lastExtras > 2) { lastExtras = t; extras.forEach((d) => d.mons.forEach((m) => drawChart(m, t * 0.7, false))); }
  }
  if (t - lastEx > 0.1) { lastEx = t; drawExchange(Date.now()); }   // letreiro precisa de um pouco mais de fluidez
  // efeitos
  for (let i = flashes.length - 1; i >= 0; i--) {
    const f = flashes[i]; f.t += dt * sp;
    if (f.l) f.l.intensity = Math.max(0, 6 * (1 - f.t / 1.5));
    if (f.ring) { const s = 1 + f.t * 8; f.ring.scale.set(s, s, s); f.ring.material.opacity = Math.max(0, 0.9 - f.t / 1.5); }
    if (f.t > 1.5) { scene.remove(f.l || f.ring); flashes.splice(i, 1); }
  }
  for (let i = packets.length - 1; i >= 0; i--) {
    const p = packets[i]; p.t += dt * sp * 0.9;
    p.m.position.lerpVectors(p.from, p.to, p.t); p.m.position.y += Math.sin(p.t * Math.PI) * 2.5; p.m.rotation.y += dt * 8;
    if (p.t >= 1) { scene.remove(p.m); packets.splice(i, 1); }
  }
  if (follow) {
    const want = astra.position.clone().add(new THREE.Vector3(0, 1, 0));
    controls.target.lerp(want, 0.06);
  }
  controls.update();
  renderer.render(scene, camera);
  labels.render(scene, camera);
  requestAnimationFrame(tick);
}

addEventListener("resize", () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight); labels.setSize(innerWidth, innerHeight);
});

// ------------------------------------------------------------------ start
(async () => {
  meta = await (await fetch("/api/meta")).json();
  tags.astra.element.querySelector("small").textContent = "operador · " + (meta.operator || "?");
  tags.luna.element.querySelector("small").textContent = "leitor de gráficos · " + (meta.charts || "?");
  tags.sol.element.querySelector("small").textContent = "advogado do diabo · " + (meta.bear || "?");
  const list = await refreshList();
  if (list.length) await load(list[0].id);
  if (list[0]?.status === "running") $("live").click();   // ciclo rodando agora: acompanha ao vivo
  renderBar(); tick(); runner();
})();
</script>
