<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pregão 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #cfe0ee; --panel: rgba(255, 255, 255, .84); --line: rgba(20, 40, 70, .12); --text: #172033;
    --dim: #5b6b82; --gold: #d4a017; --ok: #16a34a; --bad: #dc2626; --shadow: 0 10px 30px rgba(20, 40, 70, .16);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--text);
    font: 13px/1.45 Inter, "Segoe UI", system-ui, sans-serif; }
  #scene, #labels { position: fixed; inset: 0; }
  #labels { pointer-events: none; }
  .panel { position: fixed; background: var(--panel); border: 1px solid rgba(255,255,255,.7); border-radius: 14px;
    box-shadow: var(--shadow); backdrop-filter: blur(10px) saturate(1.2); }

  #top { top: 14px; left: 14px; right: 394px; padding: 8px 10px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  #top h1 { margin: 0 8px 0 4px; font-size: 15px; font-weight: 700; letter-spacing: -.01em; }
  #top h1 span { color: var(--gold); }
  select, button { font: inherit; color: var(--text); background: #fff; border: 1px solid var(--line); border-radius: 8px;
    padding: 6px 10px; cursor: pointer; }
  button:hover, select:hover { border-color: rgba(20,40,70,.3); }
  button.on { background: #172033; color: #fff; border-color: #172033; }
  #live .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #9aa6b8; margin-right: 6px; }
  #live.on { background: #fee2e2; color: #991b1b; border-color: #fca5a5; }
  #live.on .dot { background: var(--bad); animation: pulse 1s infinite; }
  @keyframes pulse { 50% { opacity: .3; } }

  #side { top: 14px; right: 14px; bottom: 14px; width: 366px; display: flex; flex-direction: column; overflow: hidden; }
  #side header { padding: 12px 14px 8px; border-bottom: 1px solid var(--line); }
  #side header h2 { margin: 0 0 2px; font-size: 13px; font-weight: 700; }
  #meta { color: var(--dim); font-size: 12px; }
  .live-tag { color: var(--bad); font-weight: 600; }
  #chat { flex: 1; overflow-y: auto; padding: 10px 12px; scroll-behavior: smooth; }
  .msg { display: flex; gap: 9px; margin-bottom: 11px; animation: in .25s ease-out; }
  @keyframes in { from { opacity: 0; transform: translateY(6px); } }
  .msg > i { flex: none; width: 26px; height: 26px; border-radius: 50%; color: #fff; font: 700 12px/26px Inter, sans-serif;
    text-align: center; font-style: normal; box-shadow: 0 2px 6px rgba(0,0,0,.15); }
  .msg > div { min-width: 0; flex: 1; }
  .msg b { font-weight: 600; }
  .msg .to { color: var(--dim); font-size: 11px; margin-left: 6px; }
  .msg code { float: right; font: 10px ui-monospace, Consolas, monospace; color: var(--dim); background: rgba(20,40,70,.06);
    padding: 1px 5px; border-radius: 4px; }
  .msg p { margin: 2px 0 0; white-space: pre-wrap; word-break: break-word; }
  .msg.think p { color: var(--dim); font-style: italic; }
  .msg.bad p { color: #991b1b; } .msg.good p { color: #166534; }
  .msg.sys { justify-content: center; color: var(--dim); font-size: 11px; text-align: center; }
  #summary { border-top: 1px solid var(--line); padding: 10px 14px 12px; max-height: 34%; overflow-y: auto; font-size: 12px; }
  #summary:empty { display: none; }
  .sumh { font-weight: 700; margin-bottom: 6px; }
  .act { margin: 4px 0; color: var(--dim); } .act b { color: var(--text); margin-right: 5px; }
  .pill { display: inline-block; font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: .04em;
    padding: 1px 6px; border-radius: 999px; margin-right: 6px; background: #e5e9f0; color: #475569; }
  .pill.entry { background: #dcfce7; color: #166534; } .pill.skip { background: #f1f5f9; }
  .pill.close, .pill.rejected { background: #fee2e2; color: #991b1b; } .pill.hold, .pill.move_stop, .pill.partial { background: #fef3c7; color: #92400e; }

  #bar { left: 14px; bottom: 14px; padding: 8px 14px; display: flex; gap: 18px; flex-wrap: wrap; }
  #bar span { color: var(--dim); margin-right: 6px; font-size: 12px; }
  #s-regime[data-v="BULL"] { color: var(--ok); } #s-regime[data-v="BEAR"] { color: var(--bad); }
  #hint { position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%); color: rgba(23,32,51,.55); font-size: 11px; pointer-events: none; }

  /* crachás e balões no 3D */
  .name { display: flex; align-items: center; gap: 5px; padding: 2px 8px 2px 5px; border-radius: 999px; white-space: nowrap;
    background: rgba(255,255,255,.9); box-shadow: 0 2px 8px rgba(0,0,0,.15); font-size: 11px; }
  .name i { width: 8px; height: 8px; border-radius: 50%; }
  .name span { font-weight: 700; }
  .name small { color: var(--dim); font-size: 10px; }
  .anchor { width: 0; height: 0; }
  .bubble { position: absolute; left: 0; bottom: 16px; width: max-content; max-width: 290px; translate: -50% 0; padding: 8px 11px; border-radius: 12px; background: #fff; color: var(--text);
    border-left: 4px solid var(--c); box-shadow: 0 8px 24px rgba(20,40,70,.25); font-size: 12.5px; line-height: 1.4;
    opacity: 0; transform: translateY(8px) scale(.96); transition: opacity .22s, transform .22s; transform-origin: bottom center;
    pointer-events: none; }
  .bubble::after { content: ""; position: absolute; left: 50%; bottom: -7px; margin-left: -7px; border: 7px solid transparent;
    border-bottom: 0; border-top-color: #fff; }
  .bubble.show { opacity: 1; transform: none; }
  .bubble em { display: block; font-style: normal; font-size: 10px; color: var(--dim); text-transform: uppercase; letter-spacing: .05em; }
  .bubble.think { background: #f1f5f9; font-style: italic; color: #475569; border-left-style: dashed; }
  .bubble.think::after { border-top-color: #f1f5f9; }
  .bubble.bad { background: #fff1f1; border-left-color: var(--bad); } .bubble.bad::after { border-top-color: #fff1f1; }
  .bubble.good { background: #effdf4; border-left-color: var(--ok); } .bubble.good::after { border-top-color: #effdf4; }

  @media (max-width: 860px) {
    #top { right: 14px; }
    #side { top: auto; height: 40%; left: 14px; width: auto; }
    #bar { bottom: calc(40% + 24px); }
  }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
</head>
<body>
<div id="scene"></div>
<div id="labels"></div>

<div id="top" class="panel">
  <h1>Pregão <span>3D</span></h1>
  <select id="cycles" title="ciclo"></select>
  <button id="play">⏸ pausar</button>
  <button id="restart">⟲ do início</button>
  <select id="speed" title="velocidade">
    <option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="2">2×</option><option value="4">4×</option>
  </select>
  <button id="live"><span class="dot"></span>ao vivo</button>
  <button id="follow">🎥 seguir conversa</button>
</div>

<aside id="side" class="panel">
  <header><h2>Conversa</h2><div id="meta">—</div></header>
  <div id="chat"></div>
  <div id="summary"></div>
</aside>

<div id="bar" class="panel">
  <div><span>regime</span><b id="s-regime">—</b></div>
  <div><span>banca</span><b id="s-equity">—</b></div>
  <div><span>posições</span><b id="s-pos">—</b></div>
  <div><span>tokens</span><b id="s-tokens">—</b></div>
</div>
<div id="hint">arraste para girar · scroll para zoom · botão direito para mover</div>

<script type="module" src="/js/main.js"></script>
</body>
</html>
