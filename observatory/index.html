<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pregão Hotel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Ubuntu:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #1b1b1b; --win: #fbfbf6; --head: #2a7ab0; --head2: #1f5f8b; --line: #111; --dim: #6b6b6b;
    --ok: #1f9d4b; --bad: #d8323c; --gold: #f2c14e;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #5fb6e8; color: var(--ink);
    font: 13px/1.35 Ubuntu, "Segoe UI", sans-serif; }
  #scene, #labels, #bubbles { position: fixed; inset: 0; }
  #scene canvas { image-rendering: pixelated; }
  #labels, #bubbles { pointer-events: none; }

  /* janelas e botões do Habbo */
  .win { position: fixed; background: var(--win); border: 2px solid var(--line); border-radius: 8px;
    box-shadow: 0 3px 0 rgba(0,0,0,.35); overflow: hidden; }
  .win > header { background: linear-gradient(var(--head), var(--head2)); color: #fff; font-weight: 700; padding: 5px 10px;
    border-bottom: 2px solid var(--line); text-shadow: 0 1px 0 rgba(0,0,0,.4); display: flex; justify-content: space-between; align-items: center; }
  .win > header small { font-weight: 400; opacity: .85; }
  .btn, select { font: 500 12px Ubuntu, sans-serif; color: var(--ink); background: linear-gradient(#fff, #dcdcd4);
    border: 2px solid var(--line); border-radius: 6px; padding: 4px 9px; cursor: pointer; box-shadow: 0 2px 0 rgba(0,0,0,.35); }
  .btn:hover, select:hover { background: linear-gradient(#fff, #ecece4); }
  .btn:active { transform: translateY(1px); box-shadow: 0 1px 0 rgba(0,0,0,.35); }
  .btn.on { background: linear-gradient(#5ec27a, #2f9a50); color: #fff; }
  #live .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #999; margin-right: 5px; border: 1px solid #000; }
  #live.on { background: linear-gradient(#ff6b6b, #d8323c); color: #fff; }
  #live.on .dot { background: #fff; animation: pulse 1s infinite; }
  @keyframes pulse { 50% { opacity: .3; } }

  #top { top: 10px; left: 10px; right: 390px; }
  #top .bar { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; padding: 7px 8px; }

  #side { top: 10px; right: 10px; bottom: 10px; width: 368px; display: flex; flex-direction: column; }
  #meta { padding: 6px 10px; color: var(--dim); font-size: 12px; border-bottom: 1px solid #ddd; }
  .live-tag { color: var(--bad); font-weight: 700; }
  #chat { flex: 1; overflow-y: auto; padding: 8px 10px; background: #fff; }
  .msg { display: flex; gap: 8px; margin-bottom: 9px; }
  .msg > i { flex: none; width: 24px; height: 24px; border-radius: 50%; border: 2px solid #000; color: #fff; font: 700 11px/20px Ubuntu;
    text-align: center; font-style: normal; }
  .msg > div { min-width: 0; flex: 1; }
  .msg .to { color: var(--dim); font-size: 11px; margin-left: 5px; }
  .msg code { float: right; font: 10px Consolas, monospace; color: var(--dim); background: #f0f0ea; border: 1px solid #ddd; padding: 0 4px; border-radius: 3px; }
  .msg p { margin: 1px 0 0; white-space: pre-wrap; word-break: break-word; }
  .msg.think p { color: var(--dim); font-style: italic; }
  .msg.bad p { color: #a3151f; } .msg.good p { color: #167a3a; }
  .msg.sys { justify-content: center; color: var(--dim); font-size: 11px; }
  #summary { border-top: 2px solid var(--line); padding: 8px 10px; max-height: 32%; overflow-y: auto; font-size: 12px; background: #f6f3e7; }
  #summary:empty { display: none; }
  .sumh { font-weight: 700; margin-bottom: 5px; }
  .act { margin: 3px 0; color: var(--dim); } .act b { color: var(--ink); margin-right: 5px; }
  .pill { display: inline-block; font-size: 10px; font-weight: 700; text-transform: uppercase; padding: 0 6px; border: 1px solid #000;
    border-radius: 4px; margin-right: 5px; background: #eee; }
  .pill.entry { background: #9be3b0; } .pill.close, .pill.rejected { background: #ffb3b8; }
  .pill.hold, .pill.move_stop, .pill.partial { background: #ffe39a; }

  /* caixa da sala (canto inferior esquerdo) + status */
  #room { left: 10px; bottom: 10px; min-width: 250px; }
  #room header { background: linear-gradient(#3b3b3b, #1f1f1f); }
  #room .body { padding: 6px 10px 8px; display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; font-size: 12px; }
  #room .body span { color: var(--dim); }
  #s-regime[data-v="BULL"] { color: var(--ok); } #s-regime[data-v="BEAR"] { color: var(--bad); }
  #hint { position: fixed; left: 50%; bottom: 12px; transform: translateX(-50%); color: rgba(0,0,0,.55); font-size: 11px; pointer-events: none; }

  /* crachá sobre a cabeça */
  .name { display: flex; align-items: center; gap: 4px; padding: 1px 7px 1px 4px; border-radius: 4px; white-space: nowrap;
    background: rgba(0,0,0,.72); color: #fff; font: 700 11px Ubuntu, sans-serif; position: relative; }
  .name i { width: 8px; height: 8px; border-radius: 50%; border: 1px solid #fff; }
  .name small { font-weight: 400; opacity: .75; font-size: 10px; }
  .name.talking::after { content: "…"; position: absolute; right: -18px; top: -14px; background: #fff; color: #000; border: 2px solid #000;
    border-radius: 8px; padding: 0 5px; line-height: 14px; font-size: 14px; animation: bob .5s ease-in-out infinite alternate; }
  @keyframes bob { to { transform: translateY(-3px); } }

  /* chat estilo Habbo: balões brancos com nome em negrito, sobem empilhados */
  .hb { position: absolute; max-width: 420px; display: flex; align-items: flex-start; gap: 6px; padding: 3px 9px 3px 3px;
    background: #fff; border: 2px solid #000; border-radius: 9px; box-shadow: 0 2px 0 rgba(0,0,0,.3); font-size: 12.5px;
    line-height: 1.3; transition: top .35s ease, opacity .6s; animation: pop .18s ease-out; }
  @keyframes pop { from { transform: scale(.7); opacity: 0; } }
  .hb i { flex: none; width: 20px; height: 20px; border-radius: 5px; border: 2px solid #000; color: #fff; font: 700 10px/16px Ubuntu;
    text-align: center; font-style: normal; }
  .hb b { margin-right: 4px; white-space: nowrap; }
  .hb em { font-style: normal; color: var(--dim); font-size: 11px; margin-right: 4px; white-space: nowrap; }
  .hb span { overflow-wrap: anywhere; }
  .hb.think { background: #eef2f7; border-style: dashed; color: #444; font-style: italic; }
  .hb.bad { background: #ffe4e6; } .hb.good { background: #e3f9e9; }
  .hb.gone { opacity: 0; }

  @media (max-width: 860px) {
    #top { right: 10px; }
    #side { top: auto; height: 38%; left: 10px; width: auto; }
    #room { bottom: calc(38% + 20px); }
  }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
</head>
<body>
<div id="scene"></div>
<div id="labels"></div>
<div id="bubbles"></div>

<div id="top" class="win">
  <div class="bar">
    <select id="cycles" title="ciclo"></select>
    <button id="play" class="btn">⏸ pausar</button>
    <button id="restart" class="btn">⟲ do início</button>
    <select id="speed" title="velocidade">
      <option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="2">2×</option><option value="4">4×</option>
    </select>
    <button id="live" class="btn"><span class="dot"></span>ao vivo</button>
    <button id="follow" class="btn">🎥 seguir conversa</button>
    <button id="center" class="btn">⌂ centralizar</button>
    <button id="pixel" class="btn">▦ pixel 2×</button>
  </div>
</div>

<aside id="side" class="win">
  <header>Histórico da conversa</header>
  <div id="meta">—</div>
  <div id="chat"></div>
  <div id="summary"></div>
</aside>

<div id="room" class="win">
  <header>★ Pregão ★ <small id="room-sub">let-me-rich</small></header>
  <div class="body">
    <span>regime</span><b id="s-regime">—</b>
    <span>banca</span><b id="s-equity">—</b>
    <span>posições</span><b id="s-pos">—</b>
    <span>tokens</span><b id="s-tokens">—</b>
  </div>
</div>
<div id="hint">arraste para mover · scroll para zoom</div>

<script type="module" src="/js/main.js"></script>
</body>
</html>
