# Universo de pares. O Claude NÃO edita este arquivo.
exchange: binance
quote: USDT

# Moedas fora desta lista e de memes são "alt".
majors: [BTC, ETH, SOL, XRP, ADA, AVAX, LINK, DOT, LTC, TRX, TON]
memes: [DOGE, SHIB, PEPE, FLOKI, BONK, WIF, BOME, MEME, PEOPLE, NEIRO, TURBO, PNUT, ACT, TRUMP, 1000SATS, 1000CAT, DOGS, BABYDOGE, MOODENG, PENGU]

# BNB fica fora (reserva para taxa). Stablecoins, wrapped e fiat fora.
blacklist: [BNB, USDC, FDUSD, TUSD, USDP, DAI, EUR, EURI, AEUR, USD1, XUSD, BFUSD, WBTC, WBETH, PAXG]

filters:
  min_quote_volume_24h: 1000000    # USDT
  max_spread_pct: 0.5
  max_tick_pct: 1.0                # 1 tick > 1% do preço = fora
  min_listing_days: {major: 0, alt: 60, meme: 30}
  block_tags: [Monitoring]

scan:
  finalists: 1000      # todos os que passam nos filtros recebem features
  top_n: 25
  weights:             # pesos do score por categoria
    major: {trend: 0.5, breakout: 0.3, momentum: 0.1, volume: 0.1}
    alt:   {trend: 0.35, breakout: 0.3, momentum: 0.2, volume: 0.15}
    meme:  {trend: 0.1, breakout: 0.2, momentum: 0.35, volume: 0.35}
