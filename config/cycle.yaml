# Como o run_cycle chama o agente. O agente NÃO edita este arquivo.
backend: codex           # codex | claude
codex_model: gpt-6-astra
codex_effort: medium
codex_path: null         # null = procura no PATH
codex_reviewers:         # modelos separados, sem tools: recebem os dados prontos do Python
  bear: {model: gpt-5.6-sol, effort: medium}     # veto automático no place_entry (força >= 4)
  charts: {model: gpt-5.6-luna, effort: low}     # tool read_charts
  # equipe da manhã do modo B3 (morning.py): cada um recebe só os dados do seu tema
  macro: {model: gpt-5.6-sol, effort: medium}     # agenda + manchetes -> risk_level sugerido (filtro, não sinal)
  context: {model: gpt-5.6-luna, effort: low}     # mercados externos -> viés externo
  tech: {model: gpt-5.6-luna, effort: low}        # features e regime do WIN -> níveis e cenários
  flow: {model: gpt-5.6-luna, effort: low}        # agressão/book do pregão anterior
  bull: {model: gpt-5.6-sol, effort: medium}      # argumenta o viés do dia (o bear do B3 usa o papel "bear")
model: claude-opus-5-5
effort: medium
max_turns: 60
max_budget_usd: 5        # estimativa a preço de lista (não é cobrança na assinatura); só trava ciclo desgovernado
timeout_min: 20
claude_path: null        # null = procura no PATH e em %USERPROFILE%\.local\bin\claude.exe
weekly:
  model: claude-opus-5-5
  effort: high
  max_turns: 40
  codex_model: gpt-6-astra
  codex_effort: high
