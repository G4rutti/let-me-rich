# Como o run_cycle chama o agente. O agente NÃO edita este arquivo.
backend: codex           # codex | claude
codex_model: gpt-6-astra
codex_effort: medium
codex_path: null         # null = procura no PATH
model: claude-opus-5-5
effort: medium
max_turns: 60
max_budget_usd: 5        # estimativa a preço de lista (não é cobrança na assinatura); só trava ciclo desgovernado
timeout_min: 20
claude_path: null        # null = procura no PATH e em %USERPROFILE%\.local\bin\claude.exe
weekly:
  model: claude-opus-5-5
  effort: high
  max_turns: 40
  codex_model: gpt-6-astra
  codex_effort: high
